[package]
name = "photocraft-genfill"
description = "Generative fill: plans the context crop, builds the mask and prompt, calls an image-edit API (OpenAI) and returns an alpha-feathered patch"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
serde_json = { workspace = true }
thiserror = { workspace = true }
base64 = "0.22"
png = "0.18"

# The network client exists on native builds only; the web build reports "desktop only".
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
ureq = { version = "3", default-features = false, features = ["rustls", "gzip"] }
