# Verificacao do Preenchimento Generativo (branch feat/generative-fill): testes, clippy e regras de camadas.
name: Genfill check

on:
  workflow_dispatch:
  push:
    branches: ["feat/generative-fill"]

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Instalar Rust
        run: |
          rustup toolchain install stable --profile minimal -c clippy
          rustup default stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: genfill-check-${{ hashFiles('Cargo.toml') }}
          restore-keys: genfill-check-
      - name: Testes, clippy e camadas (log vai para o branch ci-logs)
        continue-on-error: true
        run: |
          mkdir -p out
          cargo test -p photocraft-genfill 2>&1 | tee out/test.log
          echo "test exit: ${PIPESTATUS[0]}" >> out/test.log
          cargo test -p photocraft-engine --lib genfill 2>&1 | tee out/engine.log
          echo "engine exit: ${PIPESTATUS[0]}" >> out/engine.log
          cargo clippy -p photocraft-genfill -p photocraft-engine --all-targets -- -D warnings 2>&1 | tee out/clippy.log
          echo "clippy exit: ${PIPESTATUS[0]}" >> out/clippy.log
          cargo xtask layers 2>&1 | tee out/layers.log
          echo "layers exit: ${PIPESTATUS[0]}" >> out/layers.log
        shell: bash
      - name: Publicar logs
        if: always()
        run: |
          git config user.name "ci"; git config user.email "ci@example.com"
          git checkout --orphan ci-logs
          git rm -rf . -q || true
          mkdir -p logs && cp out/*.log logs/ 2>/dev/null || true
          git add logs && git commit -q -m "logs ${GITHUB_SHA}" || true
          git push -f origin ci-logs
