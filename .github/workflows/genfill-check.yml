# Verificacao do Preenchimento Generativo (branch feat/generative-fill): testes, clippy e regras de camadas.
name: Genfill check

on:
  workflow_dispatch:
  push:
    branches: ["feat/generative-fill"]

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Instalar Rust
        run: |
          rustup toolchain install stable --profile minimal -c clippy
          rustup default stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: genfill-check-${{ hashFiles('Cargo.toml') }}
          restore-keys: genfill-check-
      - name: Testes, clippy e camadas (log vai para o branch ci-logs)
        continue-on-error: true
        run: |
          mkdir -p out
          cargo test -p photocraft-genfill 2>&1 | tee out/test.log
          echo "test exit: ${PIPESTATUS[0]}" >> out/test.log
          cargo test -p photocraft-engine --lib genfill 2>&1 | tee out/engine.log
          echo "engine exit: ${PIPESTATUS[0]}" >> out/engine.log
          cargo test -p photocraft-engine --test panic_hunt -- --ignored 2>&1 | tee out/hunt.log
          echo "hunt exit: ${PIPESTATUS[0]}" >> out/hunt.log
          cargo clippy -p photocraft-genfill -p photocraft-engine -p photocraft-ui-egui --all-targets -- -D warnings 2>&1 | tee out/clippy.log
          echo "clippy exit: ${PIPESTATUS[0]}" >> out/clippy.log
          cargo xtask layers 2>&1 | tee out/layers.log
          echo "layers exit: ${PIPESTATUS[0]}" >> out/layers.log
        shell: bash
      - name: Publicar logs
        if: always()
        run: |
          git config user.name "ci"; git config user.email "ci@example.com"
          git checkout --orphan ci-logs
          git rm -rf . -q || true
          mkdir -p logs && cp out/*.log logs/ 2>/dev/null || true
          git add logs && git commit -q -m "logs ${GITHUB_SHA}" || true
          git push -f origin ci-logs

  shot:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Dependencias do sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libxkbcommon-dev libwayland-dev libx11-dev libxrandr-dev libxi-dev libgl1-mesa-dev libgtk-3-dev mesa-vulkan-drivers libvulkan1
      - name: Instalar Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: genfill-shot-${{ hashFiles('Cargo.toml') }}
          restore-keys: genfill-shot-
      - name: Captura da interface com a barra
        continue-on-error: true
        shell: bash
        run: |
          mkdir -p shots
          cargo run --release -p photocraft-ui-egui --example snapshot -- --out shots/bar.png --size 1440x900 --scale 1 --script '[["engine.execute",{"command":"file.new","params":{"width":1200,"height":800}}],["engine.execute",{"command":"select.rect","params":{"x":300,"y":200,"width":400,"height":250}}]]' 2>&1 | tee shots/build.log
          SCRIPT='[["engine.execute",{"command":"file.new","params":{"width":1200,"height":800}}],["engine.execute",{"command":"select.rect","params":{"x":300,"y":200,"width":400,"height":250}}]]'
          cargo run --release -p photocraft-ui-egui --example snapshot -- --out shots/prompt.png --size 1440x900 --scale 1 --script "$SCRIPT" --click-at 395,802 2>&1 | tail -3 | tee shots/prompt.log
      - name: Publicar captura
        if: always()
        run: |
          git config user.name "ci"; git config user.email "ci@example.com"
          git checkout --orphan ci-shots
          git rm -rf . -q || true
          git add -f shots
          git commit -q -m "shots ${GITHUB_SHA}" || true
          git push -f origin ci-shots

  full:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - name: Dependencias do sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libxkbcommon-dev libwayland-dev libx11-dev libxrandr-dev libxi-dev libgl1-mesa-dev libgtk-3-dev mesa-vulkan-drivers libvulkan1
      - name: Instalar Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add wasm32-unknown-unknown
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: genfill-full-${{ hashFiles('Cargo.toml') }}
          restore-keys: genfill-full-
      - name: Testes completos, wasm e parity (log vai para o branch ci-full)
        continue-on-error: true
        shell: bash
        run: |
          mkdir -p out
          cargo xtask wasm 2>&1 | tail -40 | tee out/wasm.log
          echo "wasm exit: ${PIPESTATUS[0]}" >> out/wasm.log
          cargo xtask parity 2>&1 | tail -40 | tee out/parity.log
          echo "parity exit: ${PIPESTATUS[0]}" >> out/parity.log
          cargo test -p photocraft-engine --lib genfill 2>&1 | grep -E "^test .*FAILED|test result|panicked|exit" | tail -40 | tee out/engine-all.log
          echo "engine-all exit: ${PIPESTATUS[0]}" >> out/engine-all.log
          cargo test -p photocraft-ui-egui --lib i18n 2>&1 | grep -E "^test .*FAILED|test result|panicked|failures:|exit" | tail -60 | tee out/ui-all.log
          echo "ui-all exit: ${PIPESTATUS[0]}" >> out/ui-all.log
      - name: Publicar logs
        if: always()
        run: |
          git config user.name "ci"; git config user.email "ci@example.com"
          git checkout --orphan ci-full
          git rm -rf . -q || true
          mkdir -p logs && cp out/*.log logs/ 2>/dev/null || true
          git add -f logs && git commit -q -m "logs ${GITHUB_SHA}" || true
          git push -f origin ci-full
